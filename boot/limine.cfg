# boot/limine.cfg — Limine boot menu for JNU.
#
# Modern Limine (>= v8) uses limine.conf with new syntax. This file
# uses the legacy form, which Limine still accepts via fallback. If
# you upgrade to a Limine that drops .cfg support, rename this to
# limine.conf and use the documented Limine v8 syntax.

TIMEOUT=3
DEFAULT_ENTRY=1
INTERFACE_RESOLUTION=1024x768

:JNU
PROTOCOL=limine
KERNEL_PATH=boot:///kernel.elf
MODULE_PATH=boot:///initramfs.cpio
MODULE_CMDLINE=initramfs
CMDLINE=loglevel=3

:JNU (selftest)
PROTOCOL=limine
KERNEL_PATH=boot:///kernel.elf
MODULE_PATH=boot:///initramfs.cpio
MODULE_CMDLINE=initramfs
CMDLINE=loglevel=4 selftest=1
